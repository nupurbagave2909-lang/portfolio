<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Video Grid -->
  <rect width="600" height="400" rx="16" fill="#0f172a"/>
  
  <!-- Subtle scanning lines overlay -->
  <path d="M 0 40 L 600 40 M 0 80 L 600 80 M 0 120 L 600 120 M 0 160 L 600 160 M 0 200 L 600 200 M 0 240 L 600 240 M 0 280 L 600 280 M 0 320 L 600 320 M 0 360 L 600 360" stroke="#1e293b" stroke-width="0.5"/>
  
  <!-- Viewfinder corners (high tech overlay) -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <path d="M 550 30 L 570 30 L 570 50" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <path d="M 30 350 L 30 370 L 50 370" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <path d="M 550 370 L 570 370 L 570 350" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>

  <!-- Crosshair center -->
  <circle cx="300" cy="200" r="10" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
  <line x1="300" y1="180" x2="300" y2="220" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
  <line x1="280" y1="200" x2="320" y2="200" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>

  <!-- Simulated Object Bounding Box 1 (Vehicle Drone) -->
  <rect x="120" y="90" width="160" height="150" rx="4" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <!-- Corner indicators -->
  <path d="M 115 110 L 115 85 L 140 85" stroke="#f43f5e" stroke-width="4"/>
  <!-- Tag label -->
  <rect x="120" y="65" width="110" height="25" rx="2" fill="#f43f5e"/>
  <text x="126" y="81" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="white">UAV_TARGET: 01</text>
  <!-- Confidence -->
  <text x="238" y="81" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#f43f5e">98.6%</text>

  <!-- Vector tracking lines -->
  <line x1="200" y1="165" x2="300" y2="200" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="200" cy="165" r="4" fill="#f43f5e"/>

  <!-- Simulated Object Bounding Box 2 (Secondary Object) -->
  <rect x="360" y="180" width="140" height="110" rx="4" fill="none" stroke="#10b981" stroke-width="2"/>
  <rect x="360" y="158" width="90" height="22" rx="2" fill="#10b981"/>
  <text x="366" y="173" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="white">ROVER: 02</text>
  <text x="458" y="173" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#10b981">92.1%</text>
  
  <line x1="430" y1="235" x2="300" y2="200" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="430" cy="235" r="4" fill="#10b981"/>

  <!-- Tech Stats Side Overlay (AI Stream data) -->
  <rect x="40" y="270" width="180" height="90" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="52" y="288" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#06b6d4">AOTTS ANALYSIS ENGINE</text>
  <text x="52" y="308" font-family="Inter, sans-serif" font-size="9.5" fill="#94a3b8">Inference Time: <tspan fill="white" font-weight="600">12.4 ms</tspan></text>
  <text x="52" y="325" font-family="Inter, sans-serif" font-size="9.5" fill="#94a3b8">Active Trackers: <tspan fill="white" font-weight="600">2 targets</tspan></text>
  <text x="52" y="342" font-family="Inter, sans-serif" font-size="9.5" fill="#94a3b8">FPS Stream Rate: <tspan fill="#10b981" font-weight="600">60.2 fps</tspan></text>

  <!-- Live Tag -->
  <circle cx="55" cy="55" r="6" fill="#ef4444" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="68" y="59" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="0.1em">LIVE VIDEO FEED</text>

</svg>
