<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="#f8fafc"/>
  <rect width="600" height="400" rx="16" fill="url(#bg-gradient)" opacity="0.4"/>
  
  <!-- Dashboard Top Nav Bar -->
  <rect x="0" y="0" width="600" height="60" fill="white" fill-opacity="0.7" />
  <circle cx="30" cy="30" r="10" fill="#4f46e5"/>
  <text x="50" y="35" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#1e293b">PPES Portal</text>
  <text x="160" y="34" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">PRARAMBHA PATH EVENING SCHOOL</text>
  <rect x="480" y="18" width="90" height="24" rx="12" fill="#e0e7ff"/>
  <text x="495" y="33" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#4f46e5">Admin Active</text>
  
  <!-- Sidebar -->
  <rect x="15" y="75" width="130" height="305" rx="12" fill="white" fill-opacity="0.6"/>
  <rect x="25" y="90" width="110" height="24" rx="6" fill="#eff6ff"/>
  <rect x="35" y="98" width="8" height="8" rx="2" fill="#3b82f6"/>
  <rect x="52" y="100" width="60" height="4" rx="2" fill="#3b82f6"/>
  
  <rect x="35" y="132" width="8" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="52" y="134" width="60" height="4" rx="2" fill="#94a3b8"/>
  
  <rect x="35" y="166" width="8" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="52" y="168" width="60" height="4" rx="2" fill="#94a3b8"/>
  
  <rect x="35" y="200" width="8" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="52" y="202" width="60" height="4" rx="2" fill="#94a3b8"/>
  
  <!-- Main Panel -->
  <rect x="160" y="75" width="425" height="305" rx="12" fill="white" fill-opacity="0.8" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  
  <!-- Content Header -->
  <text x="180" y="105" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#1e293b">Enrollment Overview</text>
  <text x="180" y="122" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Student logs &amp; performance details</text>
  
  <!-- Summary Cards -->
  <rect x="180" y="140" width="110" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="192" y="160" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Total Students</text>
  <text x="192" y="188" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#4f46e5">142</text>
  
  <rect x="305" y="140" width="110" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="317" y="160" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Average Attendance</text>
  <text x="317" y="188" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#10b981">94%</text>
  
  <rect x="430" y="140" width="130" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="442" y="160" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Volunteers</text>
  <text x="442" y="188" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#f43f5e">18</text>
  
  <!-- Student Table Grid -->
  <rect x="180" y="215" width="380" height="145" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="180" y="215" width="380" height="30" rx="8" fill="#f1f5f9"/>
  <text x="195" y="234" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#475569">STUDENT NAME</text>
  <text x="340" y="234" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#475569">CLASS</text>
  <text x="480" y="234" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#475569">STATUS</text>
  
  <!-- Table Rows -->
  <text x="195" y="268" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#1e293b">Rahul Kumar</text>
  <text x="340" y="268" font-family="Inter, sans-serif" font-size="11" fill="#475569">Grade 7</text>
  <rect x="480" y="256" width="55" height="16" rx="8" fill="#d1fae5"/>
  <text x="491" y="268" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#065f46">Present</text>
  <line x1="180" y1="285" x2="560" y2="285" stroke="#e2e8f0"/>
  
  <text x="195" y="308" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#1e293b">Ananya Sen</text>
  <text x="340" y="308" font-family="Inter, sans-serif" font-size="11" fill="#475569">Grade 6</text>
  <rect x="480" y="296" width="55" height="16" rx="8" fill="#d1fae5"/>
  <text x="491" y="308" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#065f46">Present</text>
  <line x1="180" y1="325" x2="560" y2="325" stroke="#e2e8f0"/>
  
  <text x="195" y="348" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#1e293b">Amit Sharma</text>
  <text x="340" y="348" font-family="Inter, sans-serif" font-size="11" fill="#475569">Grade 8</text>
  <rect x="480" y="336" width="55" height="16" rx="8" fill="#fee2e2"/>
  <text x="493" y="348" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#991b1b">Absent</text>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
</svg>
