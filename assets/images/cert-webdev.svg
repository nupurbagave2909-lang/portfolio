<svg width="800" height="560" viewBox="0 0 800 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Certificate Border Background -->
  <rect width="800" height="560" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="28" y="28" width="744" height="504" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Corner Ornamental Accents -->
  <rect x="23" y="23" width="15" height="15" fill="#0f172a"/>
  <rect x="762" y="23" width="15" height="15" fill="#0f172a"/>
  <rect x="23" y="522" width="15" height="15" fill="#0f172a"/>
  <rect x="762" y="522" width="15" height="15" fill="#0f172a"/>

  <!-- Logo Banner -->
  <g transform="translate(360, 55)">
    <rect width="80" height="60" rx="8" fill="#0a0a23"/>
    <text x="40" y="38" font-family="Courier New, monospace" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Certificate Core Text -->
  <text x="400" y="165" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0.25em">DEVELOPER CERTIFICATION</text>
  
  <text x="400" y="205" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">This document verifies that student</text>
  
  <!-- Student Name -->
  <text x="400" y="260" font-family="'Outfit', sans-serif" font-size="34" font-weight="800" fill="#0a0a23" text-anchor="middle">Nupur Sachin Bagave</text>
  <line x1="200" y1="280" x2="600" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="315" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">has successfully completed all curricular projects and requirements for</text>
  
  <!-- Certification Title -->
  <text x="400" y="360" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#10b981" text-anchor="middle">Responsive Web Design Developer</text>
  
  <text x="400" y="390" font-family="Inter, sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">An intensive training including HTML5 semantic structure, CSS flexbox, grid, and typography standards.</text>

  <text x="400" y="420" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Verified by: freeCodeCamp Developer Curriculum Authority</text>

  <!-- Signatures and Date -->
  <g transform="translate(150, 460)">
    <line x1="0" y1="20" x2="160" y2="20" stroke="#94a3b8"/>
    <text x="80" y="12" font-family="'Outfit', sans-serif" font-size="14" font-style="italic" font-weight="600" fill="#1e293b" text-anchor="middle">Quincy Larson</text>
    <text x="80" y="35" font-family="Inter, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Executive Director</text>
  </g>

  <g transform="translate(490, 460)">
    <line x1="0" y1="20" x2="160" y2="20" stroke="#94a3b8"/>
    <text x="80" y="12" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">October 2024</text>
    <text x="80" y="35" font-family="Inter, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Date Issued</text>
  </g>

  <!-- Green Verification Stamp -->
  <g transform="translate(370, 440)">
    <circle cx="30" cy="30" r="22" fill="#d1fae5"/>
    <circle cx="30" cy="30" r="18" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 22 30 L 27 35 L 38 24" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>
