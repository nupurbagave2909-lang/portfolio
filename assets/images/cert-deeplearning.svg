<svg width="800" height="560" viewBox="0 0 800 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Certificate Border Background -->
  <rect width="800" height="560" fill="#fcfbf7"/>
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="#b45309" stroke-width="6"/>
  <rect x="28" y="28" width="744" height="504" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#f59e0b" stroke-width="0.75"/>

  <!-- Corner Ornamental Accents -->
  <rect x="23" y="23" width="30" height="30" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="747" y="23" width="30" height="30" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="23" y="507" width="30" height="30" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="747" y="507" width="30" height="30" fill="none" stroke="#b45309" stroke-width="2"/>

  <!-- Logo Banner -->
  <g transform="translate(350, 60)">
    <circle cx="50" cy="40" r="30" fill="#1e293b"/>
    <text x="50" y="47" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle">AI</text>
  </g>

  <!-- Certificate Core Text -->
  <text x="400" y="170" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="0.2em">CERTIFICATE OF ACHIEVEMENT</text>
  
  <text x="400" y="210" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">This is proudly presented to</text>
  
  <!-- Student Name -->
  <text x="400" y="265" font-family="'Outfit', sans-serif" font-size="34" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="0.02em">Nupur Sachin Bagave</text>
  <line x1="200" y1="285" x2="600" y2="285" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="320" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">for successfully completing the specialized course requirements in</text>
  
  <!-- Certification Title -->
  <text x="400" y="365" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#4f46e5" text-anchor="middle">Neural Networks and Deep Learning</text>
  
  <text x="400" y="395" font-family="Inter, sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">A training program covering deep learning foundations, backpropagation, parameters, and tuning.</text>

  <text x="400" y="428" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Authorized by: DeepLearning.AI Academy</text>

  <!-- Signatures and Date -->
  <g transform="translate(150, 460)">
    <line x1="0" y1="20" x2="160" y2="20" stroke="#94a3b8"/>
    <text x="80" y="12" font-family="'Outfit', sans-serif" font-size="14" font-style="italic" font-weight="600" fill="#1e293b" text-anchor="middle">Andrew Ng</text>
    <text x="80" y="35" font-family="Inter, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Instructor Representative</text>
  </g>

  <g transform="translate(490, 460)">
    <line x1="0" y1="20" x2="160" y2="20" stroke="#94a3b8"/>
    <text x="80" y="12" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">June 2025</text>
    <text x="80" y="35" font-family="Inter, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Date of Completion</text>
  </g>

  <!-- Gold Seal Emblem -->
  <g transform="translate(370, 440)">
    <polygon points="30,0 39,18 58,15 47,31 58,47 39,44 30,62 21,44 2,47 13,31 2,15 21,18" fill="#fbbf24"/>
    <circle cx="30" cy="30" r="18" fill="#d97706"/>
    <circle cx="30" cy="30" r="15" fill="#fbbf24"/>
  </g>

</svg>
